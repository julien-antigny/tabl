name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig fmt --check build.zig back front
      - run: zig build
      - run: zig build test --summary all
      - run: zig build test -Doptimize=ReleaseSafe --summary all
